name: Institution engagement checks

on:
  pull_request:
    paths:
      - '.github/workflows/institution-engagement.yml'
      - 'src/lib/institutional/**'
      - 'src/app/api/institutions/**'
      - 'src/app/dashboard/institutions/**'
      - 'src/app/dashboard/msme/institution-sharing/**'
      - 'src/app/dashboard/msme/diagnostic-plans/**'
      - 'src/app/dashboard/msme/finance-preparation/**'
      - 'src/app/dashboard/msme/continuing-support/**'
      - 'src/app/api/msme/institution-sharing/**'
      - 'src/app/api/msme/diagnostic-plans/**'
      - 'src/app/api/msme/finance-readiness/**'
      - 'src/app/api/msme/continuing-support/**'
      - 'src/components/institutional/**'
      - 'src/types/platform.ts'
      - 'supabase/migrations/*institution_engagement*'
      - 'supabase/migrations/*institution_agent_administration*'
      - 'supabase/migrations/*institution_business_enrolment_consent*'
      - 'supabase/migrations/*institution_diagnostic*'
      - 'supabase/migrations/*institution_finance*'
      - 'supabase/migrations/*institution_continuing_support*'
      - 'supabase/migrations/*institution_support*'
      - 'supabase/migrations/*institution_views_configuration*'
      - 'supabase/migrations/*institution_configuration*'
      - 'scripts/test-institution-engagement-access.mjs'
      - 'scripts/test-institution-administration.mjs'
      - 'scripts/test-institution-finance-readiness.mjs'
      - 'scripts/test-institution-continuing-support.mjs'
      - 'scripts/test-institution-views-configuration.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/institution-engagement.yml'
      - 'src/lib/institutional/**'
      - 'src/app/api/institutions/**'
      - 'src/app/dashboard/institutions/**'
      - 'src/app/dashboard/msme/institution-sharing/**'
      - 'src/app/dashboard/msme/diagnostic-plans/**'
      - 'src/app/dashboard/msme/finance-preparation/**'
      - 'src/app/dashboard/msme/continuing-support/**'
      - 'src/app/api/msme/institution-sharing/**'
      - 'src/app/api/msme/diagnostic-plans/**'
      - 'src/app/api/msme/finance-readiness/**'
      - 'src/app/api/msme/continuing-support/**'
      - 'src/components/institutional/**'
      - 'src/types/platform.ts'
      - 'supabase/migrations/*institution_engagement*'
      - 'supabase/migrations/*institution_agent_administration*'
      - 'supabase/migrations/*institution_business_enrolment_consent*'
      - 'supabase/migrations/*institution_diagnostic*'
      - 'supabase/migrations/*institution_finance*'
      - 'supabase/migrations/*institution_continuing_support*'
      - 'supabase/migrations/*institution_support*'
      - 'supabase/migrations/*institution_views_configuration*'
      - 'supabase/migrations/*institution_configuration*'
      - 'scripts/test-institution-engagement-access.mjs'
      - 'scripts/test-institution-administration.mjs'
      - 'scripts/test-institution-finance-readiness.mjs'
      - 'scripts/test-institution-continuing-support.mjs'
      - 'scripts/test-institution-views-configuration.mjs'
      - 'package.json'
      - 'package-lock.json'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:institution-access
      - run: npm run test:institution-administration
      - run: npm run test:institution-finance
      - run: npm run test:institution-support
      - run: npm run test:institution-insights
      - run: npm run validate:auth-workspace-stability
      - run: npm run test:routing
      - run: npx eslint src/lib/institutional src/app/api/institutions src/app/api/msme/institution-sharing src/app/api/msme/diagnostic-plans src/app/api/msme/finance-readiness src/app/api/msme/continuing-support src/app/dashboard/institutions src/app/dashboard/msme/institution-sharing src/app/dashboard/msme/diagnostic-plans src/app/dashboard/msme/finance-preparation src/app/dashboard/msme/continuing-support src/components/institutional scripts/test-institution-engagement-access.mjs scripts/test-institution-administration.mjs scripts/test-institution-finance-readiness.mjs scripts/test-institution-continuing-support.mjs scripts/test-institution-views-configuration.mjs
      - run: npm run build
